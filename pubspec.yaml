name: stepauth
description: Step Tracking App — Auth Module (Member 1)
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"
dependencies:
  flutter:
    sdk: flutter
 
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.2    
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
 
  go_router: ^14.2.7
  
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  firebase_storage: ^12.1.3
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  
  platform: ^3.1.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
